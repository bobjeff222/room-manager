<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Portal - Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #f9fafb; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 12px; }
        .login-card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); width: 100%; max-width: 340px; border-left: 5px solid #1e3a8a; }
        h2 { color: #1e3a8a; font-size: 20px; margin-bottom: 6px; }
        p { font-size: 13px; color: #4b5563; margin-bottom: 16px; }
        input { width: 100%; padding: 10px; font-size: 14px; border: 1px solid #e5e7eb; border-radius: 6px; margin-bottom: 12px; }
        button { width: 100%; background: #1e3a8a; color: white; border: none; padding: 10px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .error { color: #b91c1c; font-size: 12px; margin-top: 8px; text-align: center; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Property Portal</h2>
        <p>Enter your password to unlock the dashboard.</p>
        <form onsubmit="handleLogin(event)">
            <input type="password" id="passwordInput" placeholder="Password..." required>
            <button type="submit">Unlock Dashboard</button>
        </form>
        <div id="errorMsg" class="error"></div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('passwordInput').value.trim();
            // Password check: 147stoney
            if (pass === '147stoney') {
                sessionStorage.setItem('isLoggedIn', 'true');
                window.location.href = 'dashboard.html';
            } else {
                document.getElementById('errorMsg').innerText = 'Incorrect password. Try again.';
            }
        }
    </script>
</body>
</html>
